BASE_TASK_CONFIG_PATH: run_r2r/r2r_vlnce.yaml
SIMULATOR_GPU_IDS: [0, 1]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0, 1]

TRAINER_NAME: SS-ETP-R1
ENV_NAME: R1Env

GPU_NUMBERS: 2
NUM_ENVIRONMENTS: 8  # Per GPU.
TENSORBOARD_DIR: data/logs/tensorboard_dirs/
CHECKPOINT_FOLDER: data/logs/checkpoints/
RESULTS_DIR: data/logs/checkpoints/
ONLY_LAST_SAVEALL: True
# VIDEO_DIR: data/logs/video/
# VIDEO_OPTION: ["disk"]
# 右侧top-down/topological map的原始栅格分辨率；512为原默认值，建议可试1024/2048/4096。
# VIDEO_TOPO_MAP_RESOLUTION: 4096
# VIDEO_DRAW_TEACHER_PATH: True

INFERENCE:
  SPLIT: test
  USE_CKPT_CONFIG: False
  SAMPLE: False
  CKPT_PATH: '' # Local checkpoint path
  PREDICTIONS_FILE: ''
  FORMAT: r2r
  EPISODE_COUNT: -1

EVAL:
  USE_CKPT_CONFIG: False
  # SPLIT: train_split_1goal
  SPLIT: val_unseen
  EPISODE_COUNT: -1
  # SR = 1;ndtw = 0
  EPISODE_ID: None
  # SR = 0
  CKPT_PATH_DIR: ''
  fast_eval: False
  ZERO_SHOT_PRETRAIN: False

IL:
  iters: 5000
  log_every: 200
  lr: 1e-5
  batch_size: 1 # equal to NUM_ENVIRONMENTS
  ml_weight: 1.0
  expert_policy: spl

  # RPGNav fine-tuning
  st_gasa_lr: 1e-5
  sap_lr: 1e-5
  progress_loss_weight: 0.1
  # 消融 w/o RP-Dagger: False 表示训练时不加入 route-progress 监督。
  use_progress_loss: True
  rp_planner_lr: 1e-5
  # 显式控制DAgger可训练模块；RGB/Depth编码器和航点预测器始终冻结。
  # 原版ETP-R1标准SFT：前8项设True，stgasa/rp_planner设False；RP局部后训练则只打开对应新增模块及必要打分头。
  TRAINABLE:
    # 文本token/position/task embedding；原版ETP-R1标准SFT开启，RP局部后训练关闭。
    language_embeddings: True
    # 12层指令编码器；原版ETP-R1标准SFT开启，RP局部后训练关闭。
    language_encoder: True
    # RGB/Depth特征投影、位置/导航类型编码和pano transformer；不是CLIP/ResNet视觉主干。
    panorama_embeddings: True
    # 图节点 step/position/task embedding；通常冻结，只有做全局planner整体对齐时再打开。
    global_map_embeddings: True
    # global encoder中的图-文cross-modal主干层，是在线planner的核心表征层。
    global_encoder_x_layers: True
    # SAP打分前，让每个图节点从指令token中查询相关文本信息。
    graph_query_text: True
    # graph_query_text输出后的残差变换层。
    graph_attentioned_txt: True
    # 最终global SAP动作打分头。
    global_sap_head: True
    
    # -------------------------------------------------------------------
    # RP-Planner进度预测分支、progress residual和beta；只在做RP-Planner实验时打开。
    rp_planner: True

  sample_ratio: 0.0
  decay_interval: 2000
  warmup_iters: 0
  min_lr_ratio: 1

  max_traj_len: 15
  max_text_len: 150
  loc_noise: 0.5
  waypoint_aug: False

  ghost_aug: 0.0
  back_algo: teleport
  # back_algo: control
  tryout: True
  load_from_ckpt: True
  ckpt_to_load: "data/logs/checkpoints/ckpt.iter30000.pth"
  is_requeue: False

MODEL:
  task_type: r2r
  policy_name: R1Policy

  NUM_ANGLES: 12
  pretrained_path: pretrained/r2r_rxr_ce/mlm.sap_habitat_depth/store2/model_step_367500.pt
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True

  rp_planner: True
  RP_PLANNER:
    num_bins: 5
    max_label_dist: 3.0
    beta_init: 0.1
    # 消融 w/o Progress Score: False 表示节点打分不加 progress residual。
    use_progress_score: True
    
    # 消融 w/o Type Emb.: False 表示 RP-Planner query 不加节点类型编码。
    use_type_embedding: True
    # Type Emb.模式：learned=训练得到的矩阵，random=固定随机矩阵，none=不加。
    type_embedding_mode: learned
    # 消融 w/o Step Emb.: False 表示 RP-Planner query 不加节点 step 编码。
    use_step_embedding: True
    # Step Emb.模式：learned=训练得到的矩阵，random=固定随机矩阵，none=不加。
    step_embedding_mode: learned

  merge_ghost: True
  consume_ghost: True

  spatial_output: False
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True
